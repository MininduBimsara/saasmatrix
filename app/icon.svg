<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Soft, premium pebble-like rounded background that works on both light & dark browser tabs -->
  <rect width="512" height="512" rx="140" fill="#FFFFFF" />
  <rect width="504" height="504" x="4" y="4" rx="136" stroke="#F1F5F9" stroke-width="8" />

  <g transform="translate(18, 5)">
    <!-- SaaS "S" in the identical logo hot-pink/red -->
    <text x="135" y="340" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="285" 
          fill="#FF0D46" 
          letter-spacing="-0.05em"
          text-anchor="middle">S</text>

    <!-- Pebble "P" in the identical logo deep navy -->
    <text x="300" y="340" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="285" 
          fill="#00122B" 
          letter-spacing="-0.05em"
          text-anchor="middle">P</text>

    <!-- Signature Logo Dot -->
    <circle cx="435" cy="315" r="28" fill="#FF0D46" />
  </g>
</svg>
